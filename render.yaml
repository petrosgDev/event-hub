services:
  - type: web
    name: eventhub-dbu
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false # Provide PostgreSQL connection string in Render dashboard
      - key: CHAPA_SECRET_KEY
        sync: false # Provide Chapa secret key in Render dashboard
